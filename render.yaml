services:
  - type: worker
    name: dr-24-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_PATH
        value: /var/data/dr24.sqlite3
    disk:
      name: dr24-data
      mountPath: /var/data
      sizeGB: 1
